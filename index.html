
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro Comercial por Voz</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f2f6f3;
  font-family: Arial, sans-serif;
  color: #1f2937;
}
.contenedor {
  max-width: 550px;
  margin: auto;
  padding: 20px;
}
.encabezado {
  background: #153e2d;
  color: white;
  padding: 25px;
  border-radius: 16px;
  margin-bottom: 20px;
}
h1 { margin: 0 0 10px; }
.tarjeta {
  background: white;
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px #00000010;
}
button {
  width: 100%;
  padding: 17px;
  border: 0;
  border-radius: 12px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
#microfono {
  background: #18864b;
  color: white;
  min-height: 85px;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
#microfono.grabando { background: #c0392b; }
.secundario {
  background: #e5e7eb;
  color: #1f2937;
  margin-top: 12px;
}
label {
  display: block;
  margin: 15px 0 6px;
  font-weight: bold;
}
input, textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  font-size: 16px;
}
textarea { min-height: 100px; }
#estado {
  margin-top: 12px;
  font-size: 14px;
  color: #166534;
}
.nota {
  font-size: 13px;
  color: #64748b;
  line-height: 1.5;
}
</style>
</head>
<body>

<div class="contenedor">
  <div class="encabezado">
    <h1>Registro Comercial</h1>
    <p>Registro inteligente de clientes por voz</p>
  </div>

  <div class="tarjeta">
    <button id="microfono" type="button">
      🎙️ MANTENER PRESIONADO PARA HABLAR
    </button>

    <p class="nota">
      Mantené presionado el botón mientras hablás.
      No necesitás decir "coma".
    </p>

    <label for="texto">Texto reconocido</label>
    <textarea id="texto"
      placeholder="Tu dictado aparecerá aquí..."></textarea>

    <button class="secundario" onclick="organizar()">
      Organizar datos
    </button>

    <p id="estado"></p>
  </div>

  <div class="tarjeta">
    <h3>Datos del cliente</h3>

    <label>Nombre</label>
    <input id="nombre">

    <label>Apellido</label>
    <input id="apellido">

    <label>Teléfono</label>
    <input id="telefono" type="tel">

    <label>Correo electrónico</label>
    <input id="email" type="email">

    <label>Producto de interés</label>
    <input id="producto">

    <label>Observaciones</label>
    <textarea id="observaciones"></textarea>

    <p class="nota">
      Versión de prueba: todavía no se guardan
      los datos en Google Sheets.
    </p>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<script>
const $ = id => document.getElementById(id);
const boton = $("microfono");
const estado = $("estado");

const Speech =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let reconocimiento = null;
let presionado = false;
let activo = false;
let detenerAlIniciar = false;
let textoFinal = "";

function iniciarDictado(evento) {
  if (evento.pointerType === "mouse" &&
      evento.button !== 0) return;

  if (!Speech) {
    estado.textContent =
      "Este navegador no admite reconocimiento de voz.";
    return;
  }

  if (presionado) return;
  presionado = true;
  detenerAlIniciar = false;
  textoFinal = "";

  boton.classList.add("grabando");
  boton.textContent = "🔴 HABLANDO... SOLTÁ PARA TERMINAR";
  estado.textContent = "Iniciando micrófono...";

  try {
    boton.setPointerCapture(evento.pointerId);
  } catch (e) {}

  reconocimiento = new Speech();
  reconocimiento.lang = "es-AR";
  reconocimiento.continuous = true;
  reconocimiento.interimResults = true;

  reconocimiento.onstart = () => {
    activo = true;
    estado.textContent = "Escuchando...";

    if (!presionado || detenerAlIniciar) {
      reconocimiento.stop();
    }
  };

  reconocimiento.onresult = evento => {
    let provisional = "";

    for (let i = evento.resultIndex;
         i < evento.results.length; i++) {
      const resultado = evento.results[i];
      if (resultado.isFinal) {
        textoFinal += resultado[0].transcript + " ";
      } else {
        provisional += resultado[0].transcript;
      }
    }

    $("texto").value =
      (textoFinal + provisional).trim();
  };

  reconocimiento.onerror = evento => {
    estado.textContent =
      "Error de micrófono: " + evento.error;
  };

  reconocimiento.onend = () => {
    activo = false;
    presionado = false;
    boton.classList.remove("grabando");
    boton.textContent =
      "🎙️ MANTENER PRESIONADO PARA HABLAR";

    if (!estado.textContent.startsWith("Error")) {
      estado.textContent =
        "Dictado terminado. Podés organizar los datos.";
    }
  };

  try {
    reconocimiento.start();
  } catch (e) {
    presionado = false;
    boton.classList.remove("grabando");
    boton.textContent =
      "🎙️ MANTENER PRESIONADO PARA HABLAR";
    estado.textContent = e.message;
  }
}

function terminarDictado() {
  if (!presionado) return;

  presionado = false;
  detenerAlIniciar = true;

  if (reconocimiento && activo) {
    reconocimiento.stop();
  }
}

boton.addEventListener("pointerdown", iniciarDictado);
boton.addEventListener("pointerup", terminarDictado);
boton.addEventListener("pointercancel", terminarDictado);
boton.addEventListener("lostpointercapture", terminarDictado);

function organizar() {
  const original = $("texto").value.trim();

  if (!original) {
    estado.textContent = "Primero dictá una frase.";
    return;
  }

  const campos = [
    "nombre", "apellido", "telefono",
    "email", "producto", "observaciones"
  ];
  campos.forEach(id => $(id).value = "");

  let texto = original
    .replace(/\s+/g, " ")
    .replace(/\s+arroba\s+/gi, "@")
    .replace(/\s+punto\s+/gi, ".");

  // Correo electrónico
  const correo = texto.match(
    /[\w.+-]+@[\w.-]+\.[a-z]{2,}/i
  );
  if (correo) {
    $("email").value = correo[0];
    texto = texto.replace(correo[0], " ");
  }

  // Palabras que delimitan los campos
  const limite =
    "(?=\\s+(?:tel[eé]fono|celular|whatsapp|" +
    "correo|email|interesad[oa]s? en|" +
    "le interesa|producto|necesita|requiere|" +
    "solicita|observaciones?)\\b|$)";

  // Teléfono
  const tel = texto.match(
    new RegExp(
      "\\b(?:tel[eé]fono|celular|whatsapp)" +
      "\\s*(?:es|n[uú]mero)?\\s*:?" +
      "\\s*([\\d\\s()+-]{8,25})", "i"
    )
  );

  if (tel) {
    $("telefono").value =
      tel[1].replace(/[^\d+]/g, "");
  }

  // Producto
  const producto = texto.match(
    new RegExp(
      "\\b(?:interesad[oa]s? en|le interesa|" +
      "producto)\\s*:?(?:\\s+(?:un|una|el|la))?" +
      "\\s+(.+?)" + limite, "i"
    )
  );

  if (producto) {
    $("producto").value = producto[1].trim();
  }

  // Observaciones
  const obs = texto.match(
    /\b(necesita|requiere|solicita|observaciones?)\b\s*:?\s*(.+)$/i
  );

  if (obs) {
    $("observaciones").value =
      obs[1].toLowerCase() === "observaciones"
        ? obs[2].trim()
        : (obs[1] + " " + obs[2]).trim();
  }

  // Nombre y apellido: antes del primer dato etiquetado
  const nombre = texto.split(
    /\b(?:tel[eé]fono|celular|whatsapp|correo|email|interesad[oa]s? en|le interesa|producto|necesita|requiere|solicita|observaciones?)\b/i
  )[0]
    .replace(/^(nuevo\s+cliente|cliente|nombre)\s*:?\s*/i, "")
    .replace(/[,.;]+$/g, "")
    .trim();

  const palabras = nombre.split(/\s+/).filter(Boolean);

  if (palabras.length >= 2) {
    $("nombre").value = palabras[0];
    $("apellido").value = palabras.slice(1).join(" ");
  } else if (palabras.length === 1) {
    $("nombre").value = palabras[0];
  }

  estado.textContent =
    "Datos interpretados. Revisalos antes de guardar.";
}

/* CONFIGURACIÓN DE GOOGLE SHEETS */

const GOOGLE_CLIENT_ID =
  "PEGAR_AQUI_TU_OAUTH_CLIENT_ID";

const GOOGLE_SHEET_ID =
  "PEGAR_AQUI_EL_ID_DE_TU_PLANILLA";

const GOOGLE_SCOPE =
  "https://www.googleapis.com/auth/spreadsheets";

let tokenGoogle = null;
let venceToken = 0;
let clienteOAuth = null;
let guardando = false;
let ultimoRegistroGuardado = null;

// Agregar botones sin modificar el formulario existente
const panelGoogle = document.createElement("div");
panelGoogle.className = "tarjeta";

panelGoogle.innerHTML = `
  <h3>Guardar en Google Sheets</h3>
  <button id="conectarGoogle" type="button"
    style="background:#e5e7eb;color:#1f2937">
    Conectar con Google
  </button>
  <button id="guardarGoogle" type="button"
    style="background:#18864b;color:white;margin-top:12px">
    Guardar cliente
  </button>
  <p id="estadoGoogle" role="status"
    style="font-size:14px;white-space:pre-wrap"></p>
`;

document.querySelector(".contenedor")
  .appendChild(panelGoogle);

const mensajeGoogle = document.getElementById("estadoGoogle");
const botonGuardar = document.getElementById("guardarGoogle");

function informarGoogle(mensaje) {
  mensajeGoogle.textContent = mensaje;
}

function inicializarGoogle() {
  if (!window.google?.accounts?.oauth2) {
    informarGoogle(
      "Google todavía está cargando. Intentá nuevamente."
    );
    return false;
  }

  if (!clienteOAuth) {
    clienteOAuth = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: GOOGLE_SCOPE,
      callback: () => {}
    });
  }

  return true;
}

function solicitarAcceso() {
  return new Promise((resolve, reject) => {
    if (!inicializarGoogle()) {
      reject(new Error("No se cargó Google Identity Services."));
      return;
    }

    clienteOAuth.callback = respuesta => {
      if (respuesta.error || !respuesta.access_token) {
        reject(new Error(
          respuesta.error_description ||
          respuesta.error ||
          "No se recibió autorización."
        ));
        return;
      }

      tokenGoogle = respuesta.access_token;
      venceToken = Date.now() +
        (Number(respuesta.expires_in || 3600) - 60) * 1000;

      informarGoogle("Cuenta de Google conectada.");
      resolve(tokenGoogle);
    };

    clienteOAuth.error_callback = error => {
      reject(new Error(
        "No se completó la autorización: " +
        (error.type || "error desconocido")
      ));
    };

    clienteOAuth.requestAccessToken({
      prompt: "select_account consent"
    });
  });
}

document.getElementById("conectarGoogle")
  .addEventListener("click", async () => {
    try {
      await solicitarAcceso();
    } catch (error) {
      informarGoogle(error.message);
    }
  });

function datosCliente() {
  return {
    nombre: $("nombre").value.trim(),
    apellido: $("apellido").value.trim(),
    telefono: $("telefono").value.trim(),
    email: $("email").value.trim(),
    producto: $("producto").value.trim(),
    observaciones: $("observaciones").value.trim()
  };
}

async function guardarClienteGoogle() {
  if (guardando) return;

  const datos = datosCliente();

  if (!datos.nombre || !datos.producto) {
    informarGoogle(
      "Completá al menos el nombre y el producto."
    );
    return;
  }

  const firma = JSON.stringify(datos);

  if (firma === ultimoRegistroGuardado) {
    informarGoogle(
      "Este registro ya fue guardado. " +
      "Modificá los datos antes de volver a guardar."
    );
    return;
  }

  if (!tokenGoogle || Date.now() >= venceToken) {
    informarGoogle(
      "Primero presioná Conectar con Google."
    );
    return;
  }

  guardando = true;
  botonGuardar.disabled = true;
  informarGoogle("Guardando cliente...");

  const fecha = new Intl.DateTimeFormat("sv-SE", {
    timeZone: "America/Argentina/Buenos_Aires",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
  }).format(new Date());

  const id = crypto.randomUUID();

  const fila = [
    id,
    fecha,
    datos.nombre,
    datos.apellido,
    datos.telefono,
    datos.email,
    datos.producto,
    datos.observaciones,
    "Nuevo"
  ];

  const rango = encodeURIComponent("Clientes!A:I");
  const url =
    "https://sheets.googleapis.com/v4/spreadsheets/" +
    encodeURIComponent(GOOGLE_SHEET_ID) +
    "/values/" + rango +
    ":append?valueInputOption=RAW&insertDataOption=INSERT_ROWS";

  try {
    const respuesta = await fetch(url, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + tokenGoogle,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        majorDimension: "ROWS",
        values: [fila]
      })
    });

    const resultado = await respuesta.json();

    if (!respuesta.ok) {
      if (respuesta.status === 401) {
        tokenGoogle = null;
        venceToken = 0;
      }

      throw new Error(
        resultado.error?.message ||
        "Error HTTP " + respuesta.status
      );
    }

    ultimoRegistroGuardado = firma;
    informarGoogle(
      "Cliente guardado correctamente.\n" +
      "ID: " + id
    );

  } catch (error) {
    informarGoogle(
      "No se pudo confirmar el guardado: " +
      error.message +
      ". Revisá la planilla antes de reintentar."
    );
  } finally {
    guardando = false;
    botonGuardar.disabled = false;
  }
}

botonGuardar.addEventListener(
  "click",
  guardarClienteGoogle
);
</script>
</body>
</html>
